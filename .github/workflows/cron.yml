name: Cron Jobs

on:
  schedule:
    - cron: "*/15 * * * *"  # hunt-highlights
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options:
          - hunt-highlights

jobs:
  hunt-highlights:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hunt-highlights
        run: |
          curl -fsS -X GET "${{ secrets.SITE_URL }}/api/cron/hunt-highlights" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
